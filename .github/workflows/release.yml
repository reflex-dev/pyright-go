name: Release

# Pushing a tag like v0.1.0 tests, cross-compiles all five targets, attaches
# tarballs and wheels to a GitHub release, and publishes the wheels to PyPI
# via trusted publishing (OIDC; no tokens stored). The PyPI side must be
# configured once -- see go/RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Build, vet, test
        working-directory: go
        run: |
          go build ./...
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            wheel_platform: manylinux_2_17_x86_64.manylinux2014_x86_64
          - goos: linux
            goarch: arm64
            wheel_platform: manylinux_2_17_aarch64.manylinux2014_aarch64
          - goos: darwin
            goarch: amd64
            wheel_platform: macosx_10_12_x86_64
          - goos: darwin
            goarch: arm64
            wheel_platform: macosx_11_0_arm64
          - goos: windows
            goarch: amd64
            wheel_platform: win_amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build binary
        working-directory: go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          version="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags="-s -w -X main.version=$version" \
            -o "dist/pyright-go$ext" ./cmd/pyright-go

      - name: Assemble release tarball
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="pyright-go-${version}-${{ matrix.goos }}-${{ matrix.goarch }}"
          staging="dist/$name"
          mkdir -p "$staging"
          cp go/dist/pyright-go* "$staging/"
          cp -r packages/pyright-internal/typeshed-fallback "$staging/"
          cp LICENSE.txt "$staging/"
          mkdir -p dist/release
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd dist && zip -qr "release/$name.zip" "$name")
          else
            tar -C dist -czf "dist/release/$name.tar.gz" "$name"
          fi

      - name: Build wheel
        run: |
          version="${GITHUB_REF_NAME#v}"
          binary=$(ls go/dist/pyright-go*)
          python3 go/packaging/build_wheel.py \
            --version "$version" \
            --platform "${{ matrix.wheel_platform }}" \
            --binary "$binary" \
            --typeshed packages/pyright-internal/typeshed-fallback \
            --license LICENSE.txt \
            --out dist/wheels

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/release/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/wheels/*.whl

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
